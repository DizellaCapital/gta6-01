<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e1a24; }
  #game { position: fixed; inset: 0; display: block; background: #0e1a24; }

<canvas id="game" width="1280" height="720"></canvas>
<p id="status" role="status" aria-live="polite">Solmar Bay — open-world crime game</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
